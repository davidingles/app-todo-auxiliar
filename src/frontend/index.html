<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Tasks</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-row">
          <div class="topbar-left">
            <h1>Mis Tareas</h1>
            <button id="logout-btn" class="logout-btn" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="16" height="16">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </button>
          </div>
          <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="8" />
              <path d="M21 21l-4.35-4.35" />
            </svg>
            <input id="search-input" type="text" placeholder="Buscar tareas...   (/)" autocomplete="off" />
          </div>
        </div>
        <form id="task-form" class="task-form">
          <input id="task-title" type="text" placeholder="Nueva tarea" required />
          <textarea id="task-description" placeholder="Descripción" rows="2"></textarea>
          <button type="submit">Añadir</button>
        </form>
      </header>

      <main class="kanban">
        <div class="kanban-columns">
          <section class="column" data-status="pendiente">
            <div class="column-header">
              <div>
                <h2>Pendiente</h2>
                <select class="column-sort" data-sort-control aria-label="Ordenar Pendiente">
                  <option value="manual">Manual</option>
                  <option value="date">Fecha</option>
                  <option value="tags">Etiquetas</option>
                </select>
              </div>
              <span class="badge" data-count>0</span>
            </div>
            <div class="task-list"></div>
          </section>

          <section class="column" data-status="en_proceso">
            <div class="column-header">
              <div>
                <h2>En Proceso</h2>
                <select class="column-sort" data-sort-control aria-label="Ordenar En Proceso">
                  <option value="manual">Manual</option>
                  <option value="date">Fecha</option>
                  <option value="tags">Etiquetas</option>
                </select>
              </div>
              <span class="badge" data-count>0</span>
            </div>
            <div class="task-list"></div>
          </section>

          <section class="column" data-status="completado">
            <div class="column-header">
              <div>
                <h2>Completado</h2>
                <select class="column-sort" data-sort-control aria-label="Ordenar Completado">
                  <option value="manual">Manual</option>
                  <option value="date">Fecha</option>
                  <option value="tags">Etiquetas</option>
                </select>
              </div>
              <span class="badge" data-count>0</span>
            </div>
            <div class="task-list"></div>
          </section>
        </div>

        <aside class="sidebar" data-sidebar="archivado">
          <button class="sidebar-toggle" type="button" aria-label="Alternar archivado" title="Archivado"></button>
          <section class="column" data-status="archivado">
            <div class="column-header">
              <div>
                <h2>Archivado</h2>
                <select class="column-sort" data-sort-control aria-label="Ordenar Archivado">
                  <option value="manual">Manual</option>
                  <option value="date">Fecha</option>
                  <option value="tags">Etiquetas</option>
                </select>
              </div>
              <span class="badge" data-count>0</span>
            </div>
            <div class="task-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <div id="confirm-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">Confirmar eliminación</h2>
        <p>¿Estás seguro de que deseas eliminar esta tarea?</p>
        <div class="modal-actions">
          <button id="cancel-delete" type="button">Cancelar</button>
          <button id="confirm-delete" type="button" class="danger">Eliminar</button>
        </div>
      </div>
    </div>

    <div id="edit-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-edit-close></div>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <h2 id="edit-modal-title">Editar tarea</h2>
        <label class="field">
          <span>Título</span>
          <input id="edit-task-title" type="text" />
        </label>
        <label class="field">
          <span>Descripción</span>
          <textarea id="edit-task-description" rows="4"></textarea>
        </label>
        <fieldset class="field tag-field" id="edit-task-tags">
          <legend>Etiquetas</legend>
          <label class="tag-choice tag-choice-trabajo">
            <input type="checkbox" value="trabajo" />
            <span>Trabajo</span>
          </label>
          <label class="tag-choice tag-choice-gym">
            <input type="checkbox" value="gym" />
            <span>Gym</span>
          </label>
          <label class="tag-choice tag-choice-familia">
            <input type="checkbox" value="familia" />
            <span>Familia</span>
          </label>
          <label class="tag-choice tag-choice-devs">
            <input type="checkbox" value="devs" />
            <span>Devs</span>
          </label>
          <label class="tag-choice tag-choice-religion">
            <input type="checkbox" value="religion" />
            <span>Religión</span>
          </label>
          <label class="tag-choice tag-choice-personal">
            <input type="checkbox" value="personal" />
            <span>Personal</span>
          </label>
        </fieldset>
        <div class="modal-actions">
          <button id="cancel-edit" type="button">Cancelar</button>
          <button id="save-edit" type="button" class="danger">Guardar</button>
        </div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
